<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Admin - Sistema de Museos</title>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <div class="navbar">
      <div class="nav-left">Sistema de Museos</div>
      <div class="nav-right"><a href="index.html">Cerrar sesión</a></div>
    </div>

    <!-- CONTENIDO -->
    <div class="container">
      <div class="card">
        <div class="card-header">
          <h2>Listado de Museos</h2>
          <button class="btn-agregar" onclick="agregarMuseo()">
            Agregar Museo
          </button>
        </div>

        <!-- FORMULARIO -->
        <div id="formAgregar" class="form-container" style="display: none">
          <h3 id="tituloFormulario">Agregar Museo</h3>

          <form id="formMuseo">
            <div class="form-group">
              <label>Nombre del Museo</label>
              <input type="text" id="mNombre" required />
            </div>

            <div class="form-group">
              <label>Tipo de Museo</label>
              <select id="mTipo" required></select>
            </div>

            <div class="form-group">
              <label>Estado</label>
              <select
                id="mEstado"
                required
                onchange="cargarMunicipios()"
              ></select>
            </div>

            <div class="form-group">
              <label>Municipio</label>
              <select id="mMunicipio" required></select>
            </div>

            <div class="form-group">
              <label>Dirección</label>
              <input type="text" id="mDireccion" required />
            </div>

            <div class="form-group">
              <label>Teléfono</label>
              <input type="text" id="mTelefono" />
            </div>

            <div class="form-group">
              <label>Horario</label>
              <input type="text" id="mHorario" />
            </div>

            <div class="form-buttons">
              <button
                type="button"
                class="btn-guardar"
                onclick="guardarMuseo()"
              >
                Guardar
              </button>
              <button
                type="button"
                class="btn-cancelar"
                onclick="cerrarFormulario()"
              >
                Cancelar
              </button>
            </div>
          </form>
        </div>

        <!-- LISTA DE MUSEOS -->
        <div id="listaMuseos" class="lista-museos"></div>
      </div>
    </div>

    <script src="js/admin.js"></script>
  </body>
</html>
